<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes y Proveedores - Mónica Gestión</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Barra Superior con Botón de Regreso -->
  <div class="header-bar">
    <h2>Clientes y Proveedores</h2>
    <button class="btn-regresar" id="btn-menu">← Menú Principal</button>
  </div>

  <!-- Panel Principal del Módulo -->
  <div class="panel-container">
    <h3>Directorio de Contactos</h3>
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Nombre / Razón Social</th>
          <th>Tipo</th>
          <th>Teléfono</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="tabla-clientes">
        <tr>
          <td>CLI-001</td>
          <td>Comercial San José S.A.</td>
          <td>Cliente</td>
          <td>+505 8888-8888</td>
          <td>Activo</td>
        </tr>
        <tr>
          <td>PROV-001</td>
          <td>Distribuidora Central</td>
          <td>Proveedor</td>
          <td>+505 2222-2222</td>
          <td>Activo</td>
        </tr>
      </tbody>
    </table>

    <div class="actions-bar">
      <button class="btn-action" id="btn-crear-contacto">Crear Contacto</button>
      <button class="btn-action">Editar</button>
      <button class="btn-action">Eliminar</button>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="monica-clientes.js"></script>
</body>
</html>
