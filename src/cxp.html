<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo de Cuentas por Pagar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="monica-container">
    <header class="monica-header">
      <h2>INDUSTRIAS S.A. - CUENTAS POR PAGAR (CxP)</h2>
      <div class="info-sistema">
        <span>Módulo de Eliab</span>
      </div>
    </header>

    <main class="modulos-grid-wrapper">
      <div class="titulo-ventana">REGISTRO DE CUENTAS POR PAGAR</div>

      <form id="form-cxp" style="margin-bottom: 20px;">
        <div style="display: flex; gap: 15px; margin-bottom: 15px; text-align: left;">
          <div style="flex: 1;">
            <label><strong>Proveedor:</strong></label>
            <input type="text" id="cxp-proveedor" required placeholder="Nombre del proveedor" style="width: 100%; padding: 8px;">
          </div>
          <div style="flex: 1;">
            <label><strong>Fecha:</strong></label>
            <input type="date" id="cxp-fecha" required style="width: 100%; padding: 8px;">
          </div>
          <div style="flex: 1;">
            <label><strong>Monto pendiente ($):</strong></label>
            <input type="number" step="0.01" id="cxp-monto" required placeholder="0.00" style="width: 100%; padding: 8px;">
          </div>
        </div>

        <div style="display: flex; gap: 10px; justify-content: center;">
          <button type="submit" class="btn-modulo active-modulo" style="padding: 10px 20px;">
            📁 Registrar Deuda
          </button>
          <button type="button" class="btn-modulo salir" onclick="window.location.href='index.html'" style="padding: 10px 20px;">
            ⬅️ Volver al Menú
          </button>
        </div>
      </form>

      <div class="titulo-ventana" style="margin-top: 20px;">CUENTAS POR PAGAR REGISTRADAS</div>
      <table style="width: 100%; border-collapse: collapse; background: white; color: black; margin-bottom: 15px;">
        <thead>
          <tr style="background: #1a365d; color: white;">
            <th style="padding: 8px; border: 1px solid #ccc;">ID</th>
            <th style="padding: 8px; border: 1px solid #ccc;">Proveedor</th>
            <th style="padding: 8px; border: 1px solid #ccc;">Fecha</th>
            <th style="padding: 8px; border: 1px solid #ccc;">Monto</th>
            <th style="padding: 8px; border: 1px solid #ccc;">Estado</th>
            <th style="padding: 8px; border: 1px solid #ccc;">Acción</th>
          </tr>
        </thead>
        <tbody id="tabla-cxp">
          <!-- Se llena dinámicamente -->
        </tbody>
      </table>

      <div class="status-bar">
        <span id="cxp-status">Listo para registrar cuenta por pagar</span>
      </div>
    </main>
  </div>

  <script>
    async function cargarCxP() {
      if (!window.api || !window.api.obtenerCxP) return;
      const datos = await window.api.obtenerCxP();
      const tbody = document.getElementById('tabla-cxp');
      tbody.innerHTML = '';
      datos.forEach(c => {
        tbody.innerHTML += `
          <tr>
            <td style="padding: 6px; border: 1px solid #ccc; text-align: center;">${c.id}</td>
            <td style="padding: 6px; border: 1px solid #ccc;">${c.proveedor}</td>
            <td style="padding: 6px; border: 1px solid #ccc; text-align: center;">${c.fecha}</td>
            <td style="padding: 6px; border: 1px solid #ccc; text-align: right;">$${Number(c.monto).toFixed(2)}</td>
            <td style="padding: 6px; border: 1px solid #ccc; text-align: center; color: #b7791f; font-weight: bold;">${c.estado}</td>
            <td style="padding: 6px; border: 1px solid #ccc; text-align: center;">
              <button onclick="eliminarCxP(${c.id})" style="background:#cc0000; color:white; border:none; padding:4px 8px; cursor:pointer;">❌</button>
            </td>
          </tr>
        `;
      });
    }

    document.getElementById('form-cxp').addEventListener('submit', async (e) => {
      e.preventDefault();
      const datos = {
        proveedor: document.getElementById('cxp-proveedor').value,
        fecha: document.getElementById('cxp-fecha').value,
        monto: parseFloat(document.getElementById('cxp-monto').value),
        estado: 'Pendiente'
      };

      if (window.api && window.api.guardarCxP) {
        const res = await window.api.guardarCxP(datos);
        if (res.success) {
          document.getElementById('cxp-status').innerText = `✅ Reg. CxP #${res.id} guardado con éxito.`;
          document.getElementById('form-cxp').reset();
          cargarCxP();
        } else {
          document.getElementById('cxp-status').innerText = `❌ Error: ${res.error}`;
        }
      }
    });

    async function eliminarCxP(id) {
      if (confirm('¿Deseas eliminar este registro de CxP?')) {
        await window.api.eliminarCxP(id);
        cargarCxP();
      }
    }

    window.onload = cargarCxP;
  </script>
</body>
</html>
