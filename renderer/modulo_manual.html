<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MÓNICA 9 · Manual de Usuario</title>
<style>
  :root {
    --bg: #0f172a;
    --bg-2: #111827;
    --bg-3: #1e293b;
    --panel: #1e293b;
    --panel-2: #111827;
    --border: #334155;
    --border-soft: #1e293b;
    --text: #f8fafc;
    --text-soft: #e2e8f0;
    --text-dim: #94a3b8;
    --accent: #2563eb;
    --accent-2: #1d4ed8;
    --accent-light: #60a5fa;
    --accent-soft: rgba(37, 99, 235, .18);
    --radius: 10px;
    --shadow: 0 12px 34px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .app { display: flex; flex-direction: column; min-height: 100vh; }

  ::selection { background: rgba(37, 99, 235, .4); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    background: linear-gradient(180deg, #111827, #090d16);
    border-bottom: 1px solid var(--border);
    padding: 11px 16px;
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .toolbar__brand {
    display: flex;
    align-items: center;
    gap: 11px;
    padding-right: 14px;
    margin-right: 4px;
    border-right: 1px solid var(--border);
  }

  .toolbar__mark {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 16px rgba(37, 99, 235, .4);
    flex-shrink: 0;
  }

  .toolbar__name { font-size: .95rem; font-weight: 700; letter-spacing: .2px; }
  .toolbar__name span { display: block; font-size: .72rem; font-weight: 400; color: var(--text-dim); letter-spacing: .3px; }

  .toolbar__actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .tbtn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 13px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    font-size: .82rem;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .15s ease, color .15s ease;
  }

  .tbtn svg { width: 17px; height: 17px; }
  .tbtn:hover { background: #2b3a52; border-color: #475569; transform: translateY(-1px); }
  .tbtn:active { transform: translateY(0); }
  .tbtn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }
  .tbtn--icon span { display: none; }

  @media (min-width: 760px) { .tbtn--icon span { display: inline; } }

  /* ---------- Layout ---------- */
  .body {
    flex: 1;
    display: grid;
    grid-template-columns: 330px 1fr;
    min-height: 0;
  }

  /* ---------- Panel izquierdo ---------- */
  .sidebar {
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--border);
    background: #0b1220;
  }

  .tab {
    padding: 13px 6px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    font: inherit;
    font-size: .8rem;
    font-weight: 600;
    cursor: pointer;
    transition: color .15s ease, background .15s ease, border-color .15s ease;
  }

  .tab:hover { color: var(--text); background: rgba(37, 99, 235, .12); }

  .tab.is-active {
    color: #fff;
    border-bottom-color: #fff;
    background: var(--accent);
  }

  .tabpanes { padding: 10px; overflow: auto; flex: 1; }
  .tabpane { display: none; animation: fade .2s ease; }
  .tabpane.is-active { display: block; }

  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Árbol */
  .tree { list-style: none; margin: 0; padding: 0; }

  .tree__item {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 9px 11px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--text-soft);
    font: inherit;
    font-size: .87rem;
    text-align: left;
    cursor: pointer;
    transition: background .14s ease, border-color .14s ease, color .14s ease;
  }

  .tree__item:hover { background: var(--bg-3); color: var(--text); }

  .tree__item .ic { color: var(--text-dim); flex-shrink: 0; display: grid; place-items: center; }
  .tree__item .ic svg { width: 16px; height: 16px; }

  .tree__item.is-active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .tree__item.is-active .ic { color: #fff; }

  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #0b1220;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    margin-bottom: 10px;
  }

  .search-box svg { width: 16px; height: 16px; color: var(--text-dim); flex-shrink: 0; }
  .search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font: inherit;
    font-size: .85rem;
  }
  .search-box input::placeholder { color: var(--text-dim); }

  .index-letter {
    font-size: .72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-light);
    padding: 14px 11px 6px;
  }

  .empty {
    text-align: center;
    color: var(--text-dim);
    font-size: .84rem;
    padding: 40px 16px;
  }
  .empty svg { width: 34px; height: 34px; margin-bottom: 10px; opacity: .6; }

  /* ---------- Panel derecho ---------- */
  .content {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background:
      radial-gradient(900px 420px at 100% 0%, rgba(37, 99, 235, .18), transparent 60%),
      var(--bg);
  }

  .content__top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(17, 24, 39, .75);
  }

  .breadcrumb { font-size: .8rem; color: var(--text-dim); }
  .breadcrumb b { color: var(--accent-light); font-weight: 600; }

  .feedback-link {
    font-size: .8rem;
    color: var(--accent-light);
    text-decoration: none;
    border-bottom: 1px dotted var(--accent-light);
    transition: color .15s ease;
  }
  .feedback-link:hover { color: #93c5fd; }

  .content__main { padding: 32px 38px 50px; overflow: auto; flex: 1; }

  .article { max-width: 780px; }

  .article__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 14px;
    margin-bottom: 26px;
    border-bottom: 1px solid var(--border);
  }

  .article__title {
    margin: 0;
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: .2px;
  }

  .fav-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
    padding: 7px 13px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-soft);
    font: inherit;
    font-size: .78rem;
    cursor: pointer;
    transition: all .15s ease;
  }
  .fav-btn svg { width: 15px; height: 15px; }
  .fav-btn:hover { border-color: #475569; color: var(--text); }
  .fav-btn.is-on { color: #ffd166; border-color: rgba(255, 209, 102, .5); background: rgba(255, 209, 102, .12); }

  .hero { display: flex; align-items: flex-start; gap: 24px; flex-wrap: wrap; }

  .hero__illustration {
    width: 128px;
    height: 128px;
    flex-shrink: 0;
    border-radius: 20px;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 30% 25%, rgba(37, 99, 235, .35), transparent 62%),
      linear-gradient(150deg, #1e293b, #0f172a);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .hero__illustration svg { width: 70px; height: 70px; color: var(--accent-light); }

  .article__text {
    flex: 1;
    min-width: 240px;
    font-size: 1rem;
    color: #e2e8f0;
    margin: 0;
    line-height: 1.85;
  }

  .article__text p { margin: 0 0 14px; }
  .article__text p:last-child { margin-bottom: 0; }

  .article__text.is-intro p:first-child::first-letter {
    font-size: 2.6rem;
    font-weight: 700;
    color: var(--accent-light);
    float: left;
    line-height: .9;
    padding: 4px 10px 0 0;
  }

  /* ---------- Modal de impresión ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 16, .7);
    backdrop-filter: blur(2px);
    display: none;
    place-items: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-backdrop.is-open { display: grid; }

  .modal {
    width: min(470px, 94vw);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: pop .18s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

  .modal__head {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 16px 20px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .modal__head svg { width: 20px; height: 20px; color: var(--accent-light); }
  .modal__head h2 { margin: 0; font-size: 1.02rem; font-weight: 700; }

  .modal__body { padding: 18px 20px; display: grid; gap: 10px; }

  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 15px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-3);
    cursor: pointer;
    font-size: .88rem;
    transition: border-color .15s ease, background .15s ease;
  }
  .opt:hover { border-color: #475569; }
  .opt input { accent-color: var(--accent); width: 17px; height: 17px; flex-shrink: 0; }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }

  .modal__foot {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg-2);
  }

  .btn {
    padding: 9px 20px;
    border-radius: 8px;
    font: inherit;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg-3);
    color: var(--text);
    transition: all .15s ease;
  }
  .btn:hover { background: #2b3a52; }
  .btn--primary {
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: #fff;
  }
  .btn--primary:hover { filter: brightness(1.1); }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .body { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    .tabpanes { max-height: 330px; }
  }

  @media (max-width: 620px) {
    .toolbar__name span { display: none; }
    .content__main { padding: 22px 18px 36px; }
    .content__top { padding: 10px 16px; }
    .article__title { font-size: 1.5rem; }
    .hero__illustration { width: 104px; height: 104px; }
    .hero__illustration svg { width: 56px; height: 56px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ---------- Toolbar ---------- -->
  <header class="toolbar">
    <div class="toolbar__brand">
      <div class="toolbar__mark">M9</div>
      <div class="toolbar__name">Manual de Usuario<span>Software de negocios Monica</span></div>
    </div>

    <div class="toolbar__actions">
      <button class="tbtn tbtn--icon" type="button" title="Ocultar panel de navegación" data-action="hide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M15 10l-2 2 2 2"/>
        </svg>
        <span>Ocultar</span>
      </button>

      <button class="tbtn tbtn--icon" type="button" title="Atrás" id="navBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
        </svg>
        <span>Atrás</span>
      </button>

      <button class="tbtn tbtn--icon" type="button" title="Adelante" id="navNext">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
        </svg>
        <span>Adelante</span>
      </button>

      <button class="tbtn tbtn--icon" type="button" title="Imprimir" id="printBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/>
        </svg>
        <span>Imprimir</span>
      </button>

      <button class="tbtn tbtn--icon" type="button" title="Opciones" data-action="options">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Opciones</span>
      </button>
    </div>
  </header>

  <!-- ---------- Cuerpo ---------- -->
  <div class="body">

    <!-- Panel izquierdo -->
    <aside class="sidebar" id="sidebar">
      <div class="tabs" role="tablist">
        <button class="tab is-active" type="button" role="tab" data-tab="contenido">Contenido</button>
        <button class="tab" type="button" role="tab" data-tab="indice">Índice</button>
        <button class="tab" type="button" role="tab" data-tab="buscar">Buscar</button>
        <button class="tab" type="button" role="tab" data-tab="favoritos">Favoritos</button>
      </div>

      <div class="tabpanes">

        <!-- Contenido -->
        <div class="tabpane is-active" data-pane="contenido">
          <ul class="tree" id="treeContent"></ul>
        </div>

        <!-- Índice -->
        <div class="tabpane" data-pane="indice">
          <div id="indexList"></div>
        </div>

        <!-- Buscar -->
        <div class="tabpane" data-pane="buscar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="search" id="searchInput" placeholder="Escriba para buscar…" aria-label="Buscar en el manual" />
          </div>
          <ul class="tree" id="searchResults"></ul>
        </div>

        <!-- Favoritos -->
        <div class="tabpane" data-pane="favoritos">
          <ul class="tree" id="favList"></ul>
        </div>

      </div>
    </aside>

    <!-- Panel derecho -->
    <main class="content">
      <div class="content__top">
        <div class="breadcrumb">Índice: <b>&lt;Root level&gt;</b></div>
        <a class="feedback-link" href="#" id="feedback">Enviar comentarios sobre este tema.</a>
      </div>

      <div class="content__main">
        <article class="article">
          <div class="article__head">
            <h1 class="article__title" id="topic-title">Introducción</h1>
            <button class="fav-btn" type="button" id="favBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg>
              <span id="favLabel">Agregar a favoritos</span>
            </button>
          </div>

          <div class="hero">
            <div class="hero__illustration" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                <path d="M9 7h7M9 11h7M9 15h4"/>
              </svg>
            </div>
            <div class="article__text" id="topic-text"></div>
          </div>
        </article>
      </div>
    </main>

  </div>
</div>

<!-- ---------- Modal de impresión ---------- -->
<div class="modal-backdrop" id="printModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="printTitle">
    <div class="modal__head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/>
      </svg>
      <h2 id="printTitle">Imprimir temas</h2>
    </div>
    <div class="modal__body">
      <label class="opt">
        <input type="radio" name="printScope" value="selected" checked />
        Imprimir el tema seleccionado
      </label>
      <label class="opt">
        <input type="radio" name="printScope" value="heading" />
        Imprimir el encabezado seleccionado y todos sus subtemas
      </label>
    </div>
    <div class="modal__foot">
      <button class="btn" type="button" id="printCancel">Cancelar</button>
      <button class="btn btn--primary" type="button" id="printAccept">Aceptar</button>
    </div>
  </div>
</div>

<script>
  /* ---------- Contenido de cada tema ---------- */
  const TOPICS = {
    "Introducción": {
      intro: true,
      text: [
        "Gracias por haber preferido a MONICA, para Windows, como su asistente en los negocios. Le permitirá resolver muchos de las tareas asociadas con un negocio pequeño ó mediano. MONICA ha sido diseñada para servirle de una manera fácil y rápida, pero a la vez dándole la información lo mas detalladamente posible."
      ]
    },
    "Licencia de usuario final": {
      text: [
        "El presente contrato de licencia de usuario final describe las condiciones bajo las cuales se le concede el derecho de uso del software MONICA para Windows.",
        "La licencia es personal e intransferible. No está permitida la copia, distribución o modificación del programa sin la autorización expresa del fabricante. Al instalar el producto usted acepta los términos aquí descritos."
      ]
    },
    "Como comprar el producto": {
      text: [
        "Para adquirir MONICA puede comunicarse con nuestros distribuidores autorizados o con el área comercial. Se le ofrecerán las distintas ediciones y modalidades de licencia según las necesidades de su negocio.",
        "El producto incluye el programa, su documentación y el soporte técnico correspondiente al plan adquirido."
      ]
    },
    "Videos disponibles": {
      text: [
        "MONICA pone a su disposición una serie de videos tutoriales que muestran paso a paso el uso de cada módulo del sistema.",
        "Se recomienda revisar los videos introductorios antes de comenzar a operar, para familiarizarse con la navegación y los conceptos básicos."
      ]
    },
    "Adiciones a esta versión": {
      text: [
        "Esta versión incorpora mejoras en el desempeño general del sistema, nuevos reportes y ajustes en los módulos de facturación e inventario.",
        "Consulte la lista completa de cambios para conocer todas las funcionalidades añadidas y corregidas en esta liberación."
      ]
    },
    "Instalación": {
      text: [
        "El proceso de instalación de MONICA es sencillo y guiado. Inserte el medio de instalación o ejecute el archivo descargado y siga las instrucciones que aparecerán en pantalla.",
        "Antes de comenzar, verifique que su equipo cumpla con los requisitos mínimos del sistema y cierre cualquier otra aplicación en ejecución."
      ]
    },
    "Monica": {
      text: [
        "MONICA es un software de negocios diseñado para la administración de pequeños y medianos comercios. Integra facturación, inventario, cuentas por cobrar y contabilidad en un mismo entorno.",
        "Cada módulo se complementa con los demás, de modo que la información registrada fluye de forma consistente a lo largo de todo el sistema."
      ]
    },
    "Soporte técnico": {
      text: [
        "Si presenta dificultades con el uso del programa, puede contactar a nuestro equipo de soporte técnico. Tenga a mano el número de licencia y la descripción del problema.",
        "El soporte está disponible por teléfono y correo electrónico en los horarios establecidos por el fabricante."
      ]
    }
  };

  /* ---------- Elementos ---------- */
  const titleEl = document.getElementById("topic-title");
  const textEl = document.getElementById("topic-text");
  const treeContent = document.getElementById("treeContent");
  const indexList = document.getElementById("indexList");
  const searchInput = document.getElementById("searchInput");
  const searchResults = document.getElementById("searchResults");
  const favList = document.getElementById("favList");
  const favBtn = document.getElementById("favBtn");
  const favLabel = document.getElementById("favLabel");

  const bookIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
  const chevronIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

  const treeOrder = [
    "Introducción",
    "Licencia de usuario final",
    "Como comprar el producto",
    "Videos disponibles",
    "Adiciones a esta versión",
    "Instalación",
    "Monica",
    "Soporte técnico",
    "Adiciones a esta versión"
  ];

  let current = "Introducción";
  const history = ["Introducción"];
  let histIndex = 0;
  const favorites = new Set();

  /* ---------- Render del árbol / índice ---------- */
  function renderTree() {
    treeContent.innerHTML = treeOrder.map((key) => (
      '<li><button class="tree__item" type="button" data-topic="' + key + '">' +
      '<span class="ic">' + bookIcon + "</span>" + key + "</button></li>"
    )).join("");
  }

  function renderIndex() {
    const sorted = [...new Set(treeOrder)].sort((a, b) => a.localeCompare(b, "es"));
    const groups = {};
    sorted.forEach((key) => {
      const letter = key.charAt(0).toUpperCase();
      (groups[letter] = groups[letter] || []).push(key);
    });
    indexList.innerHTML = Object.keys(groups).sort().map((letter) => (
      '<div class="index-letter">' + letter + "</div><ul class=\"tree\">" +
      groups[letter].map((key) =>
        '<li><button class="tree__item" type="button" data-topic="' + key + '">' +
        '<span class="ic">' + chevronIcon + "</span>" + key + "</button></li>"
      ).join("") + "</ul>"
    )).join("");
  }

  /* ---------- Render de favoritos ---------- */
  function renderFavorites() {
    if (favorites.size === 0) {
      favList.innerHTML = '<div class="empty">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg>' +
        "<div>Aún no tiene temas marcados como favoritos.</div></div>";
      return;
    }
    favList.innerHTML = [...favorites].map((key) =>
      '<li><button class="tree__item" type="button" data-topic="' + key + '">' +
      '<span class="ic">' + bookIcon + "</span>" + key + "</button></li>"
    ).join("");
  }

  /* ---------- Selección de tema ---------- */
  function markActive(key) {
    document.querySelectorAll(".tree__item").forEach((n) => {
      n.classList.toggle("is-active", n.dataset.topic === key);
    });
  }

  function updateFavButton() {
    const on = favorites.has(current);
    favBtn.classList.toggle("is-on", on);
    favLabel.textContent = on ? "En favoritos" : "Agregar a favoritos";
  }

  function selectTopic(key, pushHistory = true) {
    if (!TOPICS[key]) return;
    current = key;
    const topic = TOPICS[key];

    titleEl.textContent = key;
    textEl.innerHTML = topic.text.map((p) => "<p>" + p + "</p>").join("");
    textEl.classList.toggle("is-intro", !!topic.intro);

    markActive(key);
    updateFavButton();

    if (pushHistory && history[histIndex] !== key) {
      history.splice(histIndex + 1);
      history.push(key);
      histIndex = history.length - 1;
    }
    updateNavButtons();
  }

  /* ---------- Pestañas ---------- */
  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("is-active"));
      document.querySelectorAll(".tabpane").forEach((p) => p.classList.remove("is-active"));
      tab.classList.add("is-active");
      const pane = document.querySelector('[data-pane="' + tab.dataset.tab + '"]');
      if (pane) pane.classList.add("is-active");
    });
  });

  /* ---------- Delegación de clics en listas ---------- */
  document.addEventListener("click", (e) => {
    const item = e.target.closest(".tree__item");
    if (item) selectTopic(item.dataset.topic);
  });

  /* ---------- Buscador ---------- */
  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim().toLowerCase();
    const keys = [...new Set(treeOrder)];
    if (!q) {
      searchResults.innerHTML = "";
      return;
    }
    const hits = keys.filter((k) => k.toLowerCase().includes(q));
    searchResults.innerHTML = hits.length
      ? hits.map((key) =>
          '<li><button class="tree__item" type="button" data-topic="' + key + '">' +
          '<span class="ic">' + chevronIcon + "</span>" + key + "</button></li>"
        ).join("")
      : '<div class="empty">Sin resultados para “' + searchInput.value + "”.</div>";
  });

  /* ---------- Favoritos ---------- */
  favBtn.addEventListener("click", () => {
    if (favorites.has(current)) favorites.delete(current);
    else favorites.add(current);
    updateFavButton();
    renderFavorites();
  });

  /* ---------- Navegación atrás / adelante ---------- */
  const navBack = document.getElementById("navBack");
  const navNext = document.getElementById("navNext");

  function updateNavButtons() {
    navBack.disabled = histIndex <= 0;
    navNext.disabled = histIndex >= history.length - 1;
  }

  navBack.addEventListener("click", () => {
    if (histIndex > 0) {
      histIndex--;
      selectTopic(history[histIndex], false);
    }
  });

  navNext.addEventListener("click", () => {
    if (histIndex < history.length - 1) {
      histIndex++;
      selectTopic(history[histIndex], false);
    }
  });

  /* ---------- Acciones de la toolbar ---------- */
  document.querySelectorAll("[data-action]").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.dataset.action === "hide") {
        const sb = document.getElementById("sidebar");
        sb.style.display = sb.style.display === "none" ? "" : "none";
      }
    });
  });

  /* ---------- Modal de impresión ---------- */
  const printModal = document.getElementById("printModal");
  const printBtn = document.getElementById("printBtn");
  const printCancel = document.getElementById("printCancel");
  const printAccept = document.getElementById("printAccept");

  function openPrintModal() { printModal.classList.add("is-open"); }
  function closePrintModal() { printModal.classList.remove("is-open"); }

  printBtn.addEventListener("click", openPrintModal);
  printCancel.addEventListener("click", closePrintModal);
  printAccept.addEventListener("click", () => {
    closePrintModal();
    window.print();
  });
  printModal.addEventListener("click", (e) => {
    if (e.target === printModal) closePrintModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && printModal.classList.contains("is-open")) closePrintModal();
  });

  /* ---------- Init ---------- */
  renderTree();
  renderIndex();
  renderFavorites();
  selectTopic("Introducción", false);
</script>
</body>
</html>
