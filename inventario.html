<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contavex — Inventario</title>
<style>
  :root{
    --navy:#0a246a; --navy2:#2b6fd6; --accent:#2f7dff; --accent-d:#1e63d6;
    --face:#dde5f2; --face-2:#eef3fa; --panel:#ffffff;
    --line:#93a6c2; --line-2:#c7d3e6; --text:#152238; --muted:#5a6b85;
    --ok:#1f9e63; --warn:#b8860b; --danger:#c0392b;
    --shadow:0 12px 34px rgba(8,25,60,.38);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;padding:0;height:100vh;overflow:hidden;color:var(--text);
    font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}

  /* ---------- Escritorio ---------- */
  .desktop{position:relative;height:100vh;overflow:hidden;display:flex;flex-direction:column;padding:16px 16px 0;
    background:radial-gradient(900px 520px at 72% -12%,rgba(255,255,255,.45),transparent 60%),
      linear-gradient(160deg,#2f5f9e 0%,#4d84c4 42%,#8fbbe8 100%)}
  .desktop::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(420px 220px at 12% 88%,rgba(255,255,255,.18),transparent 60%)}

  /* ---------- Ventana principal ---------- */
  .win{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--face);
    border:1px solid #06204f;border-top-color:#4d7fc4;border-radius:8px 8px 0 0;box-shadow:var(--shadow);overflow:hidden}
  .titlebar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:6px 7px 6px 12px;color:#fff;background:linear-gradient(180deg,#3f7fd8,#0a246a);font-weight:600;font-size:13px}
  .tb-title{display:flex;align-items:center;gap:9px;min-width:0}
  .tb-ico{width:20px;height:20px;border-radius:4px;background:linear-gradient(145deg,#8cb6f0,#1b4a94);display:grid;place-items:center;font-size:12px;color:#fff}
  .tb-btns{display:flex;gap:4px}
  .tbb{width:26px;height:21px;border:1px solid #0a246a;border-radius:4px;color:#0a246a;font:inherit;font-size:11px;font-weight:700;cursor:pointer;
    background:linear-gradient(180deg,#fff,#cdd9ec)}
  .tbb:hover{background:linear-gradient(180deg,#fff,#b7cbe8)}
  .tbb.close{background:linear-gradient(180deg,#f6c9c2,#d88176);color:#5a1414}

  .menubar{flex:none;display:flex;gap:2px;padding:3px 8px;background:var(--face-2);border-bottom:1px solid var(--line-2);font-size:12px;color:#1b2b47}
  .menubar span{padding:3px 9px;border-radius:3px;cursor:default}
  .menubar span:hover{background:#cfe0f7}

  .tabbar{flex:none;display:flex;gap:3px;padding:7px 9px 0;background:var(--face);border-bottom:1px solid var(--line)}
  .tab{appearance:none;border:1px solid var(--line);border-bottom:none;color:#33475f;padding:6px 16px;font:inherit;font-size:12px;font-weight:600;
    border-radius:7px 7px 0 0;cursor:pointer;background:linear-gradient(180deg,#eef3fa,#d7e1f1)}
  .tab:hover{color:var(--navy);background:linear-gradient(180deg,#fff,#e3edfb)}
  .tab.active{background:linear-gradient(180deg,#fff,#eaf2ff);color:var(--navy);box-shadow:inset 0 2px 0 var(--accent)}

  .content{position:relative;flex:1;min-height:0;overflow:auto;padding:14px;background:var(--face-2)}
  .tabpane{display:none}.tabpane.active{display:block}

  /* ---------- Secciones y cuadrícula de botones ---------- */
  .sec{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 2px rgba(20,40,80,.06)}
  .sec-head{display:flex;align-items:center;gap:8px;padding:8px 12px;font-weight:700;font-size:12.5px;color:#14315e;
    background:linear-gradient(180deg,#e8f0fb,#d5e3f6);border-bottom:1px solid var(--line-2)}
  .sec-head .k{width:9px;height:9px;border-radius:2px;background:var(--accent);box-shadow:0 0 0 3px rgba(47,125,255,.18)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;padding:12px}
  .tile{appearance:none;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:13px 8px 11px;
    background:linear-gradient(180deg,#fff,#e9eff8);border:1px solid #b9c6da;border-radius:8px;color:#1b2b47;font:inherit;font-size:11.5px;font-weight:600;
    cursor:pointer;min-height:100px;transition:transform .1s ease,box-shadow .12s ease,border-color .12s ease,background .12s ease}
  .tile:hover{background:linear-gradient(180deg,#fff,#dcebff);border-color:var(--accent);box-shadow:0 6px 14px rgba(47,125,255,.25);transform:translateY(-1px)}
  .tile:active{transform:translateY(0)}
  .tile .ico{width:42px;height:42px;color:var(--accent-d)}
  .tile .ico svg{width:100%;height:100%;display:block}
  .tile .lbl{line-height:1.2}

  /* ---------- Barra de estado / tareas ---------- */
  .statusbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 10px;font-size:11.5px;color:#33475f;background:var(--face);border-top:1px solid var(--line)}
  .statusbar .sb{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:4px;padding:3px 9px;background:#eef3fa}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok)}
  .taskbar{flex:none;display:flex;align-items:center;gap:8px;height:40px;margin:0 -16px;padding:0 10px;
    background:linear-gradient(180deg,#3f77d4,#1c4aa0);border-top:1px solid #06204f;color:#fff}
  .start{display:flex;align-items:center;gap:7px;height:30px;padding:0 14px;border:1px solid #0a246a;border-radius:5px;color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;
    background:linear-gradient(180deg,#5fbf4f,#2f9e2f)}
  .start:hover{background:linear-gradient(180deg,#6fcf5d,#37ad37)}
  .task{height:30px;padding:0 14px;border:1px solid #0a246a;border-radius:5px;color:#fff;font-size:12px;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.06))}
  .tray{margin-left:auto;display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border:1px solid #0a246a;border-radius:5px;background:rgba(0,0,0,.18);font-size:12px;font-variant-numeric:tabular-nums}

  /* ---------- Diálogos (ventanas flotantes) ---------- */
  .overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(8,22,50,.45)}
  .overlay.hidden{display:none}
  .dlg{--dlg-accent:#0a246a;display:flex;flex-direction:column;width:min(1000px,96vw);max-height:90vh;background:var(--face);
    border:1px solid #06204f;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;animation:pop .16s ease}
  .dlg.sm{width:min(520px,94vw)}
  @keyframes pop{from{transform:scale(.975);opacity:.55}to{transform:none;opacity:1}}
  .dlg-title{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px 6px 12px;color:#fff;font-weight:700;font-size:13px;
    background:linear-gradient(180deg,var(--dlg-accent),#0a246a)}
  .dlg-title .dt{display:flex;align-items:center;gap:8px;min-width:0}
  .dlg-close{width:26px;height:22px;border:1px solid #5a1414;border-radius:4px;color:#5a1414;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(180deg,#f6c9c2,#d88176)}
  .dlg-body{flex:1;min-height:0;overflow:auto;padding:14px;background:var(--panel)}
  .dlg-foot{flex:none;display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;background:var(--face);border-top:1px solid var(--line)}
  .sub{font-size:11.5px;color:var(--muted);margin:0 0 10px}

  .dlg-tools{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line-2)}
  .fgroup{display:flex;flex-direction:column;gap:5px}
  .flabel{font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .fld{background:#fff;border:1px solid var(--line);border-radius:5px;padding:6px 9px;font:inherit;font-size:12px;color:var(--text);min-width:150px}
  .fld:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,125,255,.18)}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{
  -webkit-appearance:none;
  margin:0;
}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
  .radios{display:flex;gap:14px;padding-bottom:4px}
  .radio{display:flex;align-items:center;gap:6px;font-size:12px;color:#33475f;cursor:pointer}

  .btn{appearance:none;border:1px solid #8a9bb5;border-radius:6px;color:#1b2b47;padding:7px 16px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;
    background:linear-gradient(180deg,#fff,#d9e2f0)}
  .btn:hover{background:linear-gradient(180deg,#fff,#cfe0f8);border-color:var(--accent)}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:linear-gradient(180deg,#4a90ff,#1e63d6);border-color:#1e63d6;color:#fff}
  .btn-primary:hover{background:linear-gradient(180deg,#5c9cff,#2a6fe0)}
  .btn-ghost{background:linear-gradient(180deg,#fff,#eef3fa);color:#33475f}

  .tbl-wrap{border:1px solid var(--line-2);border-radius:6px;overflow:auto;max-height:46vh;background:#fff}
  table.tbl{width:100%;border-collapse:collapse;font-size:12px}
  .tbl th{position:sticky;top:0;z-index:1;background:linear-gradient(180deg,#eef3fa,#d9e2f0);color:#33475f;font-weight:700;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap}
  .tbl td{padding:7px 10px;border-bottom:1px solid #eef1f6;white-space:nowrap}
  .tbl tbody tr:hover{background:#eaf2ff}
  .tbl tfoot td{background:#eef3fa;font-weight:700;border-top:1px solid var(--line-2);border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .empty{padding:18px;color:var(--muted);font-size:12px}

  /* ---------- Gráficos ---------- */
  .charts-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;margin-bottom:14px}
  .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:14px}
  .card{position:relative;background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:12px;box-shadow:0 1px 2px rgba(20,40,80,.06)}
  .card h3{margin:0 0 4px;font-size:12.5px;color:#14315e;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card .val{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .card svg{width:100%;height:auto;display:block}

  .palette{position:absolute;z-index:90;width:236px;background:var(--face);border:1px solid #06204f;border-radius:8px;padding:11px;box-shadow:var(--shadow)}
  .palette.hidden{display:none}
  .palette .pt{font-weight:700;font-size:12px;color:#14315e;margin-bottom:8px}
  .palette label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:7px}
  .palette input[type=color]{width:40px;height:24px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:0;cursor:pointer}
  .swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .sw{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.25);cursor:pointer}
  .hidden{display:none!important}

  /* ---------- Avisos flotantes (toasts) ---------- */
  .toast{position:fixed;bottom:58px;left:50%;transform:translateX(-50%) translateY(20px);z-index:120;max-width:72vw;
    padding:11px 18px;border-radius:8px;font-size:12.5px;font-weight:600;color:#fff;box-shadow:0 14px 34px rgba(8,25,60,.45);
    opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.info{background:linear-gradient(180deg,#3f7fd8,#1e63d6);border:1px solid #164a9e}
  .toast.ok{background:linear-gradient(180deg,#2aa76a,#1f8a56);border:1px solid #14663f}
  .toast.error{background:linear-gradient(180deg,#d1503f,#b2382b);border:1px solid #8c2a20}

  .formgrid{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
  .formgrid .fld{min-width:130px}
  .req{color:var(--danger);font-weight:700}

  @media (max-width:760px){ .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))} .charts-grid{grid-template-columns:1fr} }

  @media print{
    body{background:#fff}
    .desktop{display:none}
    .overlay{position:static;background:#fff;padding:0}
    .dlg{box-shadow:none;border:none;width:100%;max-height:none}
    .dlg-foot,.dlg-tools,.dlg-close{display:none!important}
  }
</style>
</head>
<body>
<div class="desktop">
  <div class="win">
    <div class="titlebar">
      <div class="tb-title"><span class="tb-ico">▦</span> Contavex — Inventario</div>
      <div class="tb-btns"><button class="tbb" title="Minimizar">–</button><button class="tbb" title="Maximizar">▢</button><button class="tbb close" title="Cerrar">✕</button></div>
    </div>
    <div class="menubar" id="menubar"><span>Archivo</span><span>Editar</span><span>Ver</span><span>Procesos</span><span>Inventario</span><span>Ayuda</span></div>
    <div class="tabbar" id="tabs"></div>
    <div class="content" id="content"></div>
    <div class="statusbar">
      <span class="sb"><span class="dot"></span><span id="status">Listo</span></span>
      <span class="sb" id="tc">Tipo de cambio: US$ 1 = C$ 19.960</span>
      <span class="sb" id="clock"></span>
    </div>
  </div>
  <div class="taskbar">
    <button class="start"><span>⊞</span> Inicio</button>
    <button class="task">Contavex — Inventario</button>
    <span class="sb" style="border:none;background:transparent;color:#dfe9ff">Córdobas · Nicaragua</span>
    <div class="tray"><span id="trayClock"></span></div>
  </div>
</div>
<div class="overlay hidden" id="overlay"></div>
<div class="toast" id="toast"></div>
<script>
const TASA = 19.960;
const fmtNIO = new Intl.NumberFormat('es-NI',{style:'currency',currency:'NIO',minimumFractionDigits:2,maximumFractionDigits:2});
const money = n => fmtNIO.format(Number(n)||0).replace('NIO','C$').replace(/\s+/g,' ').trim();
const usd = n => 'US$ ' + ((Number(n)||0)/TASA).toLocaleString('es-NI',{minimumFractionDigits:2,maximumFractionDigits:2});
const compact = n => { n = Number(n)||0; if(Math.abs(n)>=1000) return 'C$ ' + (n/1000).toFixed(0) + 'k'; return 'C$ ' + n.toFixed(0); };
const num = n => (Number(n)||0).toLocaleString('es-NI',{minimumFractionDigits:2,maximumFractionDigits:2});
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status = m => { $('status').textContent = m; };

/* ---------- Toast / alertas ---------- */
let toastTimeout = null;
function toast(m){ var t = $('toast'); if(!t){ const o = document.createElement('div'); o.className='toast'; o.textContent=m; document.body.appendChild(o); } else { t.textContent = m; t.classList.add('show'); } clearTimeout(toastTimeout); toastTimeout = setTimeout(function(){ t.classList.remove('show'); }, 2600); }
function alerta(m){ toast(m); }

/* ---------- Fechas (deterministas, año en curso) ---------- */
const HOY = new Date();
const Y = HOY.getFullYear();
const iso = d => { const x = (d instanceof Date)?d:new Date(d); return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fecha = s => new Date(s+'T00:00:00').toLocaleDateString('es-NI',{day:'2-digit',month:'2-digit',year:'numeric'});
const MES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

/* ---------- Datos ---------- */
let PRODUCTOS = [
  ['P-0001','Arroz Faisán 5 lb','Abarrotes','Central',95.50,132.00,340,50],
  ['P-0002','Frijol Rojo La Cosecha 4 lb','Abarrotes','Central',78.00,108.00,210,40],
  ['P-0003','Azúcar San Antonio 5 lb','Abarrotes','Central',62.00,89.00,520,80],
  ['P-0004','Aceite Clover 1 L','Abarrotes','Central',118.00,165.00,96,30],
  ['P-0005','Café Molido Presto 500 g','Abarrotes','Central',0,142.00,64,24],
  ['P-0006','Leche La Perfecta 1 L','Lácteos','Norte',52.00,72.00,180,60],
  ['P-0007','Queso Seco El Progreso lb','Lácteos','Norte',0,95.00,42,15],
  ['P-0008','Frijol Negro Silvestre 2 lb','Abarrotes','Norte',41.00,58.00,270,50],
  ['P-0009','Detergente RindenMás 1 kg','Limpieza','Sur',88.00,124.00,130,35],
  ['P-0010','Jabón Marfil 3 pack','Limpieza','Sur',0,66.00,75,25],
  ['P-0011','Gaseosa Rojita 2 L','Bebidas','Sur',34.00,49.00,410,90],
  ['P-0012','Agua Purificada Cristal 5 L','Bebidas','Sur',28.00,42.00,230,60],
  ['P-0013','Harina Maseca 2 kg','Abarrotes','Central',58.00,82.00,150,40],
  ['P-0014','Cemento Canal 50 kg','Construcción','Central',295.00,378.00,60,20]
].map((p,i)=>({codigo:p[0],nombre:p[1],categoria:p[2],bodega:p[3],costo:p[4],precio:p[5],existencia:p[6],minimo:p[7],valor:p[4]*p[6]}));

/* Copia de los datos de ejemplo para sembrar la base de datos la primera vez. */
const SEED = PRODUCTOS.map(p=>({codigo:p.codigo,nombre:p.nombre,categoria:p.categoria,bodega:p.bodega,costo:p.costo,precio:p.precio,existencia:p.existencia,minimo:p.minimo}));

const ORDENES = [
  {numero:'OC-1001',proveedor:'Distribuidora La Colonia',fecha:iso(new Date(Y,0,9)),estado:'Recibida',items:[['P-0001',120],['P-0003',200],['P-0013',80]]},
  {numero:'OC-1002',proveedor:'Lácteos La Perfecta',fecha:iso(new Date(Y,1,14)),estado:'Recibida',items:[['P-0006',150],['P-0007',40]]},
  {numero:'OC-1003',proveedor:'Comercial Mántica',fecha:iso(new Date(Y,2,5)),estado:'Recibida',items:[['P-0002',180],['P-0008',120]]},
  {numero:'OC-1004',proveedor:'Distribuidora La Colonia',fecha:iso(new Date(Y,3,21)),estado:'Pendiente',items:[['P-0004',90],['P-0005',60]]},
  {numero:'OC-1005',proveedor:'Ferretería El Progreso',fecha:iso(new Date(Y,4,12)),estado:'Recibida',items:[['P-0014',70]]},
  {numero:'OC-1006',proveedor:'Comercial Mántica',fecha:iso(new Date(Y,5,8)),estado:'Recibida',items:[['P-0009',110],['P-0010',80]]},
  {numero:'OC-1007',proveedor:'Bebidas del Istmo',fecha:iso(new Date(Y,6,17)),estado:'Recibida',items:[['P-0011',300],['P-0012',180]]},
  {numero:'OC-1008',proveedor:'Distribuidora La Colonia',fecha:iso(new Date(Y,7,3)),estado:'Pendiente',items:[['P-0001',150],['P-0003',220]]},
  {numero:'OC-1009',proveedor:'Lácteos La Perfecta',fecha:iso(new Date(Y,8,25)),estado:'Recibida',items:[['P-0006',200],['P-0007',55]]},
  {numero:'OC-1010',proveedor:'Ferretería El Progreso',fecha:iso(new Date(Y,9,14)),estado:'Recibida',items:[['P-0014',90]]},
  {numero:'OC-1011',proveedor:'Bebidas del Istmo',fecha:iso(new Date(Y,10,6)),estado:'Pendiente',items:[['P-0011',260],['P-0012',140]]}
];
const costoDe = c => (PRODUCTOS.find(p=>p.codigo===c)||{costo:0}).precio; // compras se valoran a precio de lista
const costoReal = c => (PRODUCTOS.find(p=>p.codigo===c)||{costo:0}).costo;
ORDENES.forEach(o=>{ o.monto = o.items.reduce((a,it)=>a + it[1]*costoReal(it[0]),0); o.unidades = o.items.reduce((a,it)=>a+it[1],0); });

const RECEPCIONES = ORDENES.filter(o=>o.estado==='Recibida').map((o,i)=>({
  numero:'REC-'+String(2001+i), orden:o.numero, proveedor:o.proveedor, fecha:o.fecha, unidades:o.unidades, monto:o.monto
}));

const PROVEEDORES = [
  ['PR-01','Distribuidora La Colonia','Managua','2255-1010','Distribuidora La Colonia'],
  ['PR-02','Lácteos La Perfecta','Matagalpa','2772-3344','Lácteos La Perfecta'],
  ['PR-03','Comercial Mántica','Managua','2266-7788','Comercial Mántica'],
  ['PR-04','Ferretería El Progreso','Estelí','2713-9090','Ferretería El Progreso'],
  ['PR-05','Bebidas del Istmo','Masaya','2512-4545','Bebidas del Istmo']
].map(p=>({codigo:p[0],nombre:p[1],ciudad:p[2],telefono:p[3],cuenta:p[4]}));

function tileHTML(b){
  return '<button class="tile" data-modal="'+b.id+'" title="'+esc(b.tip)+'">'+
    '<span class="ico">'+ICO[b.icon]+'</span><span class="lbl">'+esc(b.label)+'</span></button>';
}
function renderShell(){
  const tabs = $('tabs'), content = $('content');
  tabs.innerHTML = ''; content.innerHTML = '';
  SECTIONS.forEach(function(s, i){
    const b = document.createElement('button');
    b.className = 'tab' + (i===0?' active':'');
    b.dataset.tab = s.id;
    b.textContent = s.title;
    tabs.appendChild(b);

    const pane = document.createElement('section');
    pane.id = 'tab-'+s.id;
    pane.className = 'tabpane' + (i===0?' active':'');
    if(s.id === 'graficos'){
      pane.innerHTML = chartsUI();
    } else if(s.id === 'productos'){
      pane.innerHTML = productsUI();
    } else {
      pane.innerHTML = '<div class="sec"><div class="sec-head"><span class="k"></span>'+esc(s.title)+
        '</div><div class="grid">'+ s.buttons.map(tileHTML).join('') +'</div></div>';
    }
    content.appendChild(pane);
  });
  tabs.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      content.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('active', p.id==='tab-'+t.dataset.tab));
      status('Sección: '+t.textContent);
      if(t.dataset.tab==='graficos') drawAllCharts();
      if(t.dataset.tab==='productos') renderProductos();
    });
  });
  content.querySelectorAll('.tile').forEach(function(t){
    t.addEventListener('click', function(){ openDialog(t.dataset.modal); });
  });
}

/* ---------- Paleta de colores emergente ---------- */
let paletteEl = null;
function closePalette(){ if(paletteEl){ paletteEl.remove(); paletteEl = null; } }
function openPalette(anchor, current, onPick){
  closePalette();
  const p = document.createElement('div');
  p.className = 'palette';
  const swatches = ['#0a246a','#2f7dff','#1f9e63','#b8860b','#c0392b','#8b5cf6','#0f766e','#33475f'];
  p.innerHTML = '<div class="pt">Color del diálogo</div>'+
    '<label>Personalizado <input type="color" value="'+current+'"></label>'+
    '<div class="swatches">'+ swatches.map(c=>'<span class="sw" style="background:'+c+'" data-c="'+c+'"></span>').join('') +'</div>';
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect();
  p.style.left = Math.min(r.left, window.innerWidth-250) + 'px';
  p.style.top = Math.min(r.bottom+6, window.innerHeight-160) + 'px';
  paletteEl = p;
  const input = p.querySelector('input');
  input.addEventListener('input', ()=> onPick(input.value));
  p.querySelectorAll('.sw').forEach(sw=> sw.addEventListener('click', ()=>{ input.value = sw.dataset.c; onPick(sw.dataset.c); }));
  setTimeout(()=> document.addEventListener('mousedown', outside), 0);
  function outside(e){ if(paletteEl && !paletteEl.contains(e.target) && e.target!==anchor){ closePalette(); document.removeEventListener('mousedown', outside); } }
}

/* ---------- Ventana modal (diálogo Windows) ---------- */
let dlgState = null;
function openDialog(id){
  const cfg = MODAL[id];
  if(!cfg) return;
  closePalette();
  const overlay = $('overlay');
  overlay.innerHTML = '';
  overlay.classList.remove('hidden');

  const dlg = document.createElement('div');
  dlg.className = 'dlg' + (cfg.small?' sm':'');

  const head = document.createElement('div');
  head.className = 'dlg-title';
  head.innerHTML = '<div class="dt"><span class="tb-ico">▦</span> '+esc(cfg.title)+'</div>';
  const close = document.createElement('button');
  close.className = 'dlg-close'; close.textContent = '✕'; close.title = 'Cerrar';
  close.addEventListener('click', ()=> cerrarDialogo());
  head.appendChild(close);

  const body = document.createElement('div');
  body.className = 'dlg-body';

  if(cfg.al || cfg.buscar){
    const tools = document.createElement('div');
    tools.className = 'dlg-tools';
    if(cfg.al){
      tools.innerHTML += '<div class="fgroup"><label class="flabel">Al (fecha final)</label><input type="date" class="fld" id="dlg-al" value="'+iso(HOY)+'"></div>';
    }
    if(cfg.buscar){
      tools.innerHTML += '<div class="fgroup"><label class="flabel">Buscar</label><input type="text" class="fld" id="dlg-texto" placeholder="'+esc(cfg.buscar)+'"></div>';
      tools.innerHTML += '<button class="btn btn-ghost" id="dlg-limpiar">Limpiar</button>';
    }
    tools.innerHTML += '<div style="display:flex;gap:8px"><button class="btn btn-primary" id="dlg-buscar">Buscar</button><button class="btn btn-ghost" id="dlg-aceptar">Aceptar</button></div>';
    body.appendChild(tools);
  }

  const host = document.createElement('div');
  host.id = 'dlg-host';
  body.appendChild(host);
  if(cfg.subtitle){ const s=document.createElement('p'); s.className='sub'; s.textContent=cfg.subtitle; body.insertBefore(s, body.firstChild); }

  const foot = document.createElement('div');
  foot.className = 'dlg-foot';
  foot.innerHTML = '<button class="btn btn-primary" id="dlg-guardar">Guardar/Aceptar</button>'+
    '<button class="btn" id="dlg-imprimir">Imprimir</button>'+
    '<button class="btn" id="dlg-color">Cambiar color</button>'+
    '<button class="btn btn-ghost" id="dlg-cancelar">Cancelar</button>'+
    '<button class="btn btn-ghost" id="dlg-editar">Editar</button>'+
    '<button class="btn btn-ghost" id="dlg-eliminar">Eliminar</button>'+
    '<button class="btn btn-primary" id="dlg-salir">Salir</button>';

  dlg.appendChild(head); dlg.appendChild(body); dlg.appendChild(foot);
  overlay.appendChild(dlg);
  dlgState = { cfg:cfg, host:host, dlg:dlg };

  function render(){
    const al = cfg.al ? ($('dlg-al').value || iso(HOY)) : iso(HOY);
    const texto = cfg.buscar ? ($('dlg-texto').value.trim().toLowerCase()) : '';
    const r = cfg.rows({ al:al, texto:texto });
    host.innerHTML = tableHTML(r.cols, r.rows, r.total);
    status(cfg.title + ' · ' + r.rows.length + ' registro(s) · Al ' + fecha(al));
  }
  dlgState.render = render;

  if($('dlg-buscar')) $('dlg-buscar').addEventListener('click', render);
  if($('dlg-aceptar')) $('dlg-aceptar').addEventListener('click', render);
  if($('dlg-texto')) $('dlg-texto').addEventListener('input', render);
  if($('dlg-al')) $('dlg-al').addEventListener('change', render);

  $('dlg-imprimir').addEventListener('click', ()=>{ status('Enviando a impresora: '+cfg.title); window.print(); });
  $('dlg-color').addEventListener('click', function(){ openPalette(this, '#0a246a', c=> dlg.style.setProperty('--dlg-accent', c)); });
  $('dlg-cancelar').addEventListener('click', ()=> cerrarDialogo());
  $('dlg-salir').addEventListener('click', ()=> cerrarDialogo());
  $('dlg-guardar').addEventListener('click', function(){
    var texto = cfg.buscar ? ($('dlg-texto').value.trim().toLowerCase()) : '';
    if(!texto){ toast('Ingrese texto o criterio de búsqueda.'); $('dlg-texto').focus(); return; }
    toast('Guardado: '+cfg.title);
    cerrarDialogo();
  });
  $('dlg-limpiar').addEventListener('click', function(){ $('dlg-texto').value = ''; toast('Campos limpiados.'); });
  $('dlg-editar').addEventListener('click', function(){
    var selected = registros.find(function(r){ return matchText(r.codigo+' '+r.nombre, $('dlg-texto').value); });
    if(selected){ toast('Producto seleccionado para editar: '+selected.nombre); }
    else{ toast('No hay producto seleccionado.'); }
  });
  $('dlg-eliminar').addEventListener('click', function(){
    if(confirm('¿Eliminar el producto seleccionado?')){ toast('Eliminación solicitada (requiere IPC).'); }
    else{ toast('Eliminación cancelada.'); }
  });

  render();
}
function cerrarDialogo(){ $('overlay').classList.add('hidden'); $('overlay').innerHTML=''; dlgState=null; closePalette(); status('Listo'); }

function tableHTML(cols, rows, total){
  if(!rows.length) return '<p class="empty">No hay información para los criterios indicados.</p>';
  let h = '<div class="tbl-wrap"><table class="tbl"><thead><tr>';
  cols.forEach(c=> h += '<th'+(c.num?' class="num"':'')+'>'+esc(c.t)+'</th>');
  h += '</tr></thead><tbody>';
  rows.forEach(r=>{ h += '<tr>'; r.forEach(c=> h += '<td'+(c.num?' class="num"':'')+'>'+c.v+'</td>'); h += '</tr>'; });
  h += '</tbody>';
  if(total){ h += '<tfoot><tr>'; total.forEach(c=> h += '<td'+(c.num?' class="num"':'')+'>'+c.v+'</td>'); h += '</tr></tfoot>'; }
  h += '</table></div>';
  return h;
}
const matchText = (hay, t) => !t || String(hay).toLowerCase().indexOf(t) !== -1;

const MODAL = {
  listado:{ title:'Listado de Productos', buscar:'Producto / código', rows:function(f){
    const rr = PRODUCTOS.filter(p=>matchText(p.codigo+' '+p.nombre+' '+p.categoria+' '+p.bodega, f.texto));
    let tv=0, tu=0;
    const rows = rr.map(p=>{ tv+=p.valor; tu+=p.existencia; return [
      {v:esc(p.codigo)},{v:esc(p.nombre)},{v:esc(p.categoria)},{v:esc(p.bodega)},
      {v:money(p.costo),num:true},{v:money(p.precio),num:true},{v:num(p.existencia),num:true},{v:money(p.valor),num:true}];});
    return {cols:[{t:'Código'},{t:'Producto'},{t:'Categoría'},{t:'Bodega'},{t:'Costo',num:true},{t:'Precio',num:true},{t:'Existencia',num:true},{t:'Valor',num:true}],
      rows:rows, total:rows.length?[{v:'Totales ('+rows.length+')'},{v:''},{v:''},{v:''},{v:''},{v:''},{v:num(tu),num:true},{v:money(tv),num:true}]:null};
  }},
  sincosto:{ title:'Productos sin costo', subtitle:'Productos sin costo registrado (costo = 0).', buscar:'Producto / código', rows:function(f){
    const rr = PRODUCTOS.filter(p=>p.costo<=0 && matchText(p.codigo+' '+p.nombre+' '+p.bodega, f.texto));
    const rows = rr.map(p=>[{v:esc(p.codigo)},{v:esc(p.nombre)},{v:esc(p.bodega)},{v:money(p.precio),num:true},{v:num(p.existencia),num:true}]);
    return {cols:[{t:'Código'},{t:'Producto'},{t:'Bodega'},{t:'Precio venta',num:true},{t:'Existencia',num:true}],
      rows:rows, total:rows.length?[{v:'Total ('+rows.length+')'},{v:''},{v:''},{v:''},{v:num(rr.reduce((a,p)=>a+p.existencia,0)),num:true}]:null};
  }},
  existencias:{ title:'Existencias por Bodega', buscar:'Bodega', rows:function(f){
    const g={}; PRODUCTOS.forEach(p=>{ if(!matchText(p.bodega,f.texto)) return; if(!g[p.bodega]) g[p.bodega]={n:0,u:0,v:0}; g[p.bodega].n++; g[p.bodega].u+=p.existencia; g[p.bodega].v+=p.valor; });
    const rows=Object.keys(g).sort().map(b=>[{v:esc(b)},{v:String(g[b].n),num:true},{v:num(g[b].u),num:true},{v:money(g[b].v),num:true}]);
    const vu=Object.keys(g).reduce((a,b)=>a+g[b].u,0), vv=Object.keys(g).reduce((a,b)=>a+g[b].v,0);
    return {cols:[{t:'Bodega'},{t:'Productos',num:true},{t:'Unidades',num:true},{t:'Valor',num:true}],rows:rows,
      total:rows.length?[{v:'Totales'},{v:''},{v:num(vu),num:true},{v:money(vv),num:true}]:null};
  }},
  minimos:{ title:'Productos bajo mínimo', buscar:'Producto', rows:function(f){
    const rr=PRODUCTOS.filter(p=>p.existencia<=p.minimo && matchText(p.codigo+' '+p.nombre+' '+p.bodega,f.texto));
    const rows=rr.map(p=>[{v:esc(p.codigo)},{v:esc(p.nombre)},{v:esc(p.bodega)},{v:num(p.existencia),num:true},{v:num(p.minimo),num:true},{v:num(p.minimo-p.existencia),num:true}]);
    return {cols:[{t:'Código'},{t:'Producto'},{t:'Bodega'},{t:'Existencia',num:true},{t:'Mínimo',num:true},{t:'Faltante',num:true}],rows:rows,total:null};
  }},
  movimientos:{ title:'Movimientos de Inventario', al:true, buscar:'Producto', rows:function(f){
    const rr=MOVIMIENTOS.filter(m=>m.fecha<=f.al && matchText(m.codigo+' '+m.producto+' '+m.tipo,f.texto));
    const rows=rr.slice().sort((a,b)=>a.fecha<b.fecha?1:-1).map(m=>[{v:fecha(m.fecha)},{v:esc(m.codigo)},{v:esc(m.producto)},{v:esc(m.tipo)},{v:(m.cantidad>0?'+':'')+num(m.cantidad),num:true},{v:num(m.saldo),num:true}]);
    return {cols:[{t:'Fecha'},{t:'Código'},{t:'Producto'},{t:'Tipo'},{t:'Cantidad',num:true},{t:'Saldo',num:true}],rows:rows,total:null};
  }},
  ajustes:{ title:'Ajustes de Inventario', al:true, buscar:'Producto', rows:function(f){
    const rr=MOVIMIENTOS.filter(m=>m.tipo==='Ajuste' && m.fecha<=f.al && matchText(m.codigo+' '+m.producto,f.texto));
    const rows=rr.map(m=>[{v:fecha(m.fecha)},{v:esc(m.codigo)},{v:esc(m.producto)},{v:(m.cantidad>0?'+':'')+num(m.cantidad),num:true},{v:num(m.saldo),num:true}]);
    return {cols:[{t:'Fecha'},{t:'Código'},{t:'Producto'},{t:'Ajuste',num:true},{t:'Saldo',num:true}],rows:rows,total:null};
  }},
  valorizacion:{ title:'Valorización de Inventario', buscar:'Producto', rows:function(f){
    const rr=PRODUCTOS.filter(p=>matchText(p.codigo+' '+p.nombre,f.texto)); let tv=0;
    const rows=rr.map(p=>{tv+=p.valor; return [{v:esc(p.nombre)},{v:num(p.existencia),num:true},{v:money(p.costo),num:true},{v:money(p.valor),num:true}];});

/* ---------- Paletas de color para la pestaña Gráficos ---------- */
const PALETAS_GRAFICOS = [
  {
    nombre: 'Azul clásico',
    grid: '#e3e9f3', axis: '#93a6c2',

    }
  }
];
let indicePaletaGraficos = -1;

function aplicarPaletaGraficos(pal){
  if(!pal) return;
  if(pal.grid) chartColors.grid = pal.grid;
  if(pal.axis) chartColors.axis = pal.axis;
  ['valor','total','devol','orden'].forEach(function(k){
    const s = pal.series && pal.series[k];
    if(!s) return;
    chartColors.series[k] = s.borderColor;
    chartColors.fill[k] = s.backgroundColor;
  });
}

function cambiarColorGraficos(){
  indicePaletaGraficos = (indicePaletaGraficos + 1) % PALETAS_GRAFICOS.length;
  const pal = PALETAS_GRAFICOS[indicePaletaGraficos];
  aplicarPaletaGraficos(pal);
  drawAllCharts();
  if(typeof toast === 'function') toast('Paleta de gráficos: ' + pal.nombre);
}
function mcount(){ const v=$('ch-al')?$('ch-al').value:iso(HOY); const d=v?new Date(v+'T00:00:00'):HOY; return Math.max(1,Math.min(12,d.getMonth()+1)); }
function chartType(){ const r=document.querySelector('input[name="ch-tipo"]:checked'); return r?r.value:'line'; }
function svgChart(key, type){
  const data=SERIES[key].slice(0,mcount()), labels=MES.slice(0,data.length);
  const W=560,H=280,pad={l:60,r:16,t:18,b:36}, pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  const mx=(Math.max.apply(null,data)||1)*1.15, n=data.length;
  const X=i=> pad.l + (n<=1? pw/2 : pw*i/(n-1));
  const Y=v=> pad.t + ph - (v/mx)*ph;
  const bw=(pw/n)*0.56;
  let s='';
  for(let g=0;g<=4;g++){ const gy=pad.t+ph-(g/4)*ph;
    s+='<line x1="'+pad.l+'" y1="'+gy+'" x2="'+(W-pad.r)+'" y2="'+gy+'" stroke="'+chartColors.grid+'"/>';
    s+='<text x="'+(pad.l-8)+'" y="'+(gy+4)+'" text-anchor="end" font-size="10" fill="'+chartColors.text+'">'+compact(mx*g/4)+'</text>'; }
  s+='<line x1="'+pad.l+'" y1="'+pad.t+'" x2="'+pad.l+'" y2="'+(pad.t+ph)+'" stroke="'+chartColors.axis+'"/>';
  s+='<line x1="'+pad.l+'" y1="'+(pad.t+ph)+'" x2="'+(W-pad.r)+'" y2="'+(pad.t+ph)+'" stroke="'+chartColors.axis+'"/>';
  const col=colorOf(key);
  const fillCol=chartColors.fill[key] || col;
  const fillOpacity=chartColors.fill[key] ? '' : ' opacity="0.12"';
  if(type==='bar'){
    data.forEach((v,i)=>{ const bx=pad.l+(pw/n)*i+((pw/n)-bw)/2, by=Y(v);
      s+='<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+(pad.t+ph-by)+'" rx="2" fill="'+fillCol+'" stroke="'+col+'"><title>'+labels[i]+': '+money(v)+'</title></rect>'; });
  } else {
    const pts=data.map((v,i)=>X(i)+','+Y(v)).join(' ');
    s+='<polygon points="'+pad.l+','+(pad.t+ph)+' '+pts+' '+(pad.l+pw)+','+(pad.t+ph)+'" fill="'+fillCol+'"'+fillOpacity+'/>';
    s+='<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round"/>';
    data.forEach((v,i)=>{ s+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3.6" fill="#fff" stroke="'+col+'" stroke-width="2.2"><title>'+labels[i]+': '+money(v)+'</title></circle>'; });
  }
  data.forEach((v,i)=>{ s+='<text x="'+X(i)+'" y="'+(pad.t+ph+18)+'" text-anchor="middle" font-size="10.5" fill="'+chartColors.text+'">'+labels[i]+'</text>'; });
  return s;
}
function drawAllCharts(){
  if(!$('ch-valor')) return;
  const type=chartType();
  ['valor','total','devol','orden'].forEach(function(k){
    const e=$('ch-'+k); if(e) e.innerHTML=svgChart(k,type);
    const sum=$('sum-'+k); if(sum) sum.textContent = money(SERIES[k].slice(0,mcount()).reduce((a,b)=>a+b,0));
  });
  status('Gráficos · '+(type==='bar'?'Barras':'Lineal')+' · '+mcount()+' mes(es)');
}
function chartsPalette(anchor){
  closePalette();
  const p=document.createElement('div'); p.className='palette';
  const keys=[['valor','Valor inv.'],['total','Total x Mes'],['devol','Devoluciones'],['orden','Órdenes']];
  p.innerHTML='<div class="pt">Colores de las gráficas</div>'+
    keys.map(k=>'<label>'+k[1]+' <input type="color" data-k="'+k[0]+'" value="'+colorOf(k[0])+'"></label>').join('')+
    '<label>Rejilla <input type="color" data-k="__grid" value="'+chartColors.grid+'"></label>'+
    '<label>Ejes <input type="color" data-k="__axis" value="'+chartColors.axis+'"></label>'+
    '<div class="swatches">'+['#2f7dff','#1f9e63','#b8860b','#8b5cf6','#c0392b','#0f766e'].map(c=>'<span class="sw" style="background:'+c+'" data-c="'+c+'"></span>').join('')+'</div>';
  document.body.appendChild(p);
  const r=anchor.getBoundingClientRect();
  p.style.left=Math.min(r.left,window.innerWidth-256)+'px';
  p.style.top=Math.min(r.bottom+6,window.innerHeight-330)+'px';
  paletteEl=p;
  p.querySelectorAll('input[type=color]').forEach(inp=> inp.addEventListener('input',()=>{
    const k=inp.dataset.k;
    if(k==='__grid') chartColors.grid=inp.value;
    else if(k==='__axis') chartColors.axis=inp.value;
    else chartColors.series[k]=inp.value;
    drawAllCharts();
  }));
  p.querySelectorAll('.sw').forEach(sw=> sw.addEventListener('click',()=>{
    const c=sw.dataset.c;
    ['valor','total','devol','orden'].forEach(k=> chartColors.series[k]=c);
    p.querySelectorAll('input[type="color"]:not([data-k="__grid"]):not([data-k="__axis"])').forEach(i=> i.value=c);
    drawAllCharts();
  }));
  setTimeout(()=> document.addEventListener('mousedown', outside),0);
  function outside(e){ if(paletteEl && !paletteEl.contains(e.target) && e.target!==anchor){ closePalette(); document.removeEventListener('mousedown', outside); } }
}
function bindCharts(){
  if($('ch-al')) $('ch-al').addEventListener('change', drawAllCharts);
  document.querySelectorAll('input[name="ch-tipo"]').forEach(r=> r.addEventListener('change', drawAllCharts));
  if($('ch-color')) $('ch-color').addEventListener('click', function(){ chartsPalette(this); });
}

function mapProducto(r){
  const costo = Number(r && r.costo || 0), existencia = Number(r && r.existencia || 0);
  return {
    codigo: String(r && r.codigo || ''), nombre: String(r && r.nombre || ''),
    categoria: String((r && r.categoria) || ''), bodega: String((r && r.bodega) || ''),
    costo: costo, precio: Number(r && r.precio || 0), existencia: existencia,
    minimo: Number(r && r.minimo || 0), valor: costo * existencia
  };
}
function setProductos(rows){ PRODUCTOS = (rows || []).map(mapProducto); }

function actualizarModo(){
  const e = $('p-modo'); if(!e) return;
  e.textContent = hasIPC ? ('SQLite · contabilidad.db' + (editandoCodigo ? (' · editando '+editandoCodigo) : '')) : 'Modo local (sin SQLite)';
}

function renderProductos(filtro){
  try {
    // Asegurar que PRODUCTOS esté definido como arreglo
    if(typeof PRODUCTOS === 'undefined' || PRODUCTOS === null){ PRODUCTOS = []; }
    const host = $('p-tabla'); if(!host) return;
    var rows = PRODUCTOS.slice();
    
    // Aplicar filtro si se proporciona
    if(filtro){
      var f = filtro.toLowerCase();
      rows = rows.filter(function(p){
        return p.codigo.toLowerCase().indexOf(f) !== -1 ||
          p.nombre.toLowerCase().indexOf(f) !== -1 ||
          (p.categoria && p.categoria.toLowerCase().indexOf(f) !== -1) ||
          (p.bodega && p.bodega.toLowerCase().indexOf(f) !== -1);
      });
    }
    
    // ORDENAMIENTO ALFANUMÉRICO ESTRICTO: P-1, P-2, ..., P-9, P-10, P-11 ...
    rows.sort(function(a, b) {
      return String(a.codigo).localeCompare(String(b.codigo), undefined, { numeric: true, sensitivity: 'base' });
    });
    
    // Resto del código...
    
    let tv=0, tu=0;
    rows.forEach(function(p){
      const cv = Number(p.costo) || 0;
      const ev = Number(p.existencia) || 0;
      tv += Number(p.valor) || (cv * ev);
      tu += ev;
    });
    // Renderizar: si hay datos, construir tabla; si no, mensaje de vacío
    let h = '';
    if(rows.length > 0){
      h = '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
        '<th>CÓDIGO</th><th>PRODUCTO</th><th>CATEGORÍA</th><th>BODEGA</th>'+
        '<th class="num">COSTO</th><th class="num">PRECIO</th><th class="num">EXISTENCIA</th><th class="num">MÍNIMO</th><th class="num">VALOR</th><th>ACCIONES</th>'+
        '</tr></thead><tbody>';
      rows.forEach(function(p){
        const costoVal = Number(p.costo) || 0;
        const precioVal = Number(p.precio) || 0;
        const existenciaVal = Number(p.existencia) || 0;
        const minimoVal = Number(p.minimo) || 0;
        const valorVal = Number(p.valor) || (costoVal * existenciaVal);

        h += '<tr>' +
          '<td>' + esc(p.codigo) + '</td>' +
          '<td>' + esc(p.nombre) + '</td>' +
          '<td>' + esc(p.categoria || '—') + '</td>' +
          '<td>' + esc(p.bodega || '—') + '</td>' +
          '<td class="num">' + money(costoVal) + '</td>' +
          '<td class="num">' + money(precioVal) + '</td>' +
          '<td class="num">' + num(existenciaVal) + '</td>' +
          '<td class="num">' + num(minimoVal) + '</td>' +
          '<td class="num">' + money(valorVal) + '</td>' +
          '<td>' +
            '<button class="btn" style="padding:4px 10px" data-edit="' + esc(p.codigo) + '">Editar</button> ' +
            '<button class="btn" style="padding:4px 10px" data-del="' + esc(p.codigo) + '">Eliminar</button> ' +
            '<button class="btn" style="padding:4px 10px" data-ajustar="' + esc(p.codigo) + '">Ajustar</button>' +
          '</td>' +
        '</tr>';
      });
      h += '</tbody><tfoot><tr><td>Totales ('+rows.length+')</td><td></td><td></td><td></td>'+
        '<td></td><td></td><td class="num">'+num(tu)+'</td><td></td><td class="num">'+money(tv)+'</td><td></td></tr></tfoot></table></div>';
    } else {
      h = '<p class="empty">No hay productos registrados. Use el formulario de arriba para agregar el primero.</p>';
    }
    host.innerHTML = h;
  } catch(e){
    console.error('Error en renderProductos:', e);
    // Tabla de emergencia visual directamente en #p-tabla
    const host = $('p-tabla'); if(host){
      host.innerHTML = '<p class="empty" style="color:red; padding:12px">Error al renderizar la tabla: ' + (e.message||'unknown') + '. Use el formulario para volver a cargar.</p>';
    }
  }
}

function leerForm(){
  const getVal = (id) => {
    const el = document.getElementById(id) || document.querySelector('#' + id) || document.querySelector('[name="' + id + '"]');
    return el ? el.value.trim() : '';
  };
  const costoEl = document.getElementById('p-costo');
  const precioEl = document.getElementById('p-precio');
  const existenciaEl = document.getElementById('p-existencia');
  const minimoEl = document.getElementById('p-minimo');

  return {
    codigo: (document.getElementById('p-codigo') ? document.getElementById('p-codigo').value : '').trim(),
    nombre: getVal('p-nombre'),
    categoria: getVal('p-categoria'),
    bodega: getVal('p-bodega'),
    costo: parseFloat(costoEl ? costoEl.value : '') || 0,
    precio: parseFloat(precioEl ? precioEl.value : '') || 0,
    existencia: parseFloat(existenciaEl ? existenciaEl.value : '') || 0,
    minimo: parseFloat(minimoEl ? minimoEl.value : '') || 0
  };
}
function validarProducto(d){
  if(!d || !d.codigo){
    toast('El código del producto es requerido.','error');
    const el = document.getElementById('p-codigo');
    if(el) el.focus();
    return null;
  }
  if(!d.nombre){
    toast('El nombre del producto es requerido.','error');
    const el = document.getElementById('p-nombre');
    if(el) el.focus();
    return null;
  }
  return d;
}
function sugerirSiguienteCodigo(){
  var mayor = 0;
  (PRODUCTOS || []).forEach(function(p){
    var m = /^P-(\d+)$/i.exec(String((p && p.codigo) || '').trim());
    if(m){
      var n = parseInt(m[1], 10);
      if(isFinite(n) && n > mayor) mayor = n;
    }
  });
  return 'P-' + String(mayor + 1).padStart(4, '0');
}

function asignarCodigoSugerido(){
  if(editandoCodigo) return;
  var el = document.getElementById('p-codigo');
  if(el){ el.disabled = false; el.value = sugerirSiguienteCodigo(); }
}

function limpiarForm(){
  ['p-nombre','p-categoria','p-bodega','p-costo','p-precio','p-existencia','p-minimo'].forEach(function(id){ if($(id)) $(id).value=''; });
  editandoCodigo = null;
  asignarCodigoSugerido();
  hideForm(); $('status').textContent = 'Listo';
}

function recargar(){
  if(!hasIPC){ renderProductos(); actualizarModo(); asignarCodigoSugerido(); return Promise.resolve(); }
  return Promise.resolve(window.api.listarProductos()).then(function(rows){
    if(Array.isArray(rows) && rows.length){ setProductos(rows); renderProductos(); actualizarModo(); return null; }
    if(window.api.seedProductos && typeof window.api.seedProductos==='function'){
      return Promise.resolve(window.api.seedProductos(SEED))
        .then(function(){ return window.api.listarProductos(); })
        .then(function(rows2){ setProductos(Array.isArray(rows2)?rows2:SEED); renderProductos(); actualizarModo(); });
    }
    setProductos(rows); renderProductos(); actualizarModo();
  }).catch(function(){ toast('No se pudo cargar productos desde SQLite.','error'); renderProductos(); actualizarModo(); })
    .then(function(){ asignarCodigoSugerido(); });
}

function guardarProducto(){
  const d = validarProducto(leerForm()); if(!d) return;
  const esEdicion = !!editandoCodigo;
  const codigoIngresado = String(d.codigo || '').trim().toUpperCase();
  const existe = PRODUCTOS.some(function(x) {
    return String(x.codigo || '').trim().toUpperCase() === codigoIngresado;
  });

  if (!esEdicion && existe) {
    toast('El código de producto "' + d.codigo + '" ya existe. Use un código diferente.', 'error');
    if ($('p-codigo')) $('p-codigo').focus();
    return;
  }

  if(hasIPC){
    const p = esEdicion ? window.api.actualizarProducto(editandoCodigo, d) : window.api.crearProducto(d);
    Promise.resolve(p).then(function(r){
      if(r && r.ok){
        limpiarForm();
        toast((esEdicion?'Producto actualizado: ':'Producto creado: ')+((r.data&&r.data.nombre)||d.nombre),'ok');
        return recargar();
      } else {
        toast((r && r.error) || 'No se pudo guardar el producto.','error');
      }
    }).catch(function(){ toast('No se pudo guardar (error de IPC).','error'); });
  } else {
    const i = PRODUCTOS.findIndex(function(x){ return x.codigo===d.codigo; });
    if(esEdicion){
      const j = PRODUCTOS.findIndex(function(x){ return x.codigo===editandoCodigo; });
      if(j===-1){ toast('El producto "'+editandoCodigo+'" no existe.','error'); return; }
      PRODUCTOS[j] = mapProducto(Object.assign({}, d, { codigo: editandoCodigo }));
    } else {
      if(i!==-1){ toast('Ya existe un producto con el código "'+d.codigo+'".','error'); return; }
      PRODUCTOS.push(mapProducto(d));
    }
    toast((esEdicion?'Producto actualizado: ':'Producto creado: ')+d.nombre,'ok');
    limpiarForm(); renderProductos();
  }
}

function onTablaProductos(e){
  const t = e.target.closest('[data-edit],[data-del],[data-ajustar]'); if(!t) return;
  const cod = t.getAttribute('data-edit') || t.getAttribute('data-del') || t.getAttribute('data-ajustar');
  const p = PRODUCTOS.find(function(x){ return x.codigo===cod; }); if(!p) return;
  if(t.hasAttribute('data-edit')){
    editandoCodigo = p.codigo;
    $('p-codigo').value = p.codigo; $('p-codigo').disabled = true;
    $('p-nombre').value = p.nombre; $('p-categoria').value = p.categoria||''; $('p-bodega').value = p.bodega||'';
    $('p-costo').value = p.costo; $('p-precio').value = p.precio;
    $('p-existencia').value = p.existencia; $('p-minimo').value = p.minimo;
    actualizarModo(); toast('Editando '+p.nombre,'info'); $('p-nombre').focus();
    return;
  }
  if(t.hasAttribute('data-del')){
    if(!confirm('¿Eliminar el producto "'+p.nombre+'" ('+p.codigo+')?')) return;
    if(hasIPC){
      Promise.resolve(window.api.eliminarProducto(p.codigo)).then(function(r){
        if(r && r.ok){ toast('Producto eliminado: '+p.nombre,'ok'); if(editandoCodigo===p.codigo) limpiarForm(); recargar(); }
        else toast((r && r.error) || 'No se pudo eliminar el producto.','error');
      }).catch(function(){ toast('No se pudo eliminar (error de IPC).','error'); });
    } else {
      PRODUCTOS = PRODUCTOS.filter(function(x){ return x.codigo!==p.codigo; });
      if(editandoCodigo===p.codigo) limpiarForm();
      toast('Producto eliminado: '+p.nombre,'ok'); renderProductos();
    }
    return;
  }
  if(t.hasAttribute('data-ajustar')){
    var nuevoStock = prompt('Ingrese el nuevo stock para '+p.nombre+' (código: '+p.codigo+')', p.existencia);
    if(nuevoStock===null) return;
    nuevoStock = Number(nuevoStock);
    if(isNaN(nuevoStock) || nuevoStock<0){ toast('Stock inválido. Debe ser un número >= 0.','error'); return; }
    if(hasIPC){
      Promise.resolve(window.api.actualizarProducto(p.codigo, {existencia:nuevoStock})).then(function(r){
        if(r && r.ok){ toast('Stock actualizado: '+p.nombre+' → '+nuevoStock,'ok'); recargar(); }
        else toast((r && r.error) || 'No se pudo actualizar el stock.','error');
      }).catch(function(){ toast('Error actualizando stock (error de IPC).','error'); });
    } else {
      var idx = PRODUCTOS.findIndex(function(x){ return x.codigo===p.codigo; });
      if(idx!==-1){ PRODUCTOS[idx].existencia = nuevoStock; renderProductos(); toast('Stock actualizado: '+p.nombre+' → '+nuevoStock,'ok'); }
    }
  }
}

function bindProductos(){
  if($('p-guardar')) $('p-guardar').addEventListener('click', guardarProducto);
  if($('p-limpiar')) $('p-limpiar').addEventListener('click', function(){ limpiarForm(); toast('Formulario limpio.','info'); });
  if($('p-tabla')) $('p-tabla').addEventListener('click', onTablaProductos);
  if($('p-buscar')) $('p-buscar').addEventListener('input', function(){ renderProductos(this.value); });
}

function hideForm(){
  $('form-producto').style.display = 'none';
  $('contenido-productos').style.display = 'block';
}

function showForm(){
  $('form-producto').style.display = 'block';
  $('contenido-productos').style.display = 'none';
  $('p-nombre').focus();
}

/* ---------- Inicio ---------- */
function init(){
  renderShell();                    // a) Primera: pinta layout, formulario, pestañas y #p-tabla
  bindProductos();                  // b) Segunda: Vincula eventos de la tabla DESPUÉS de que #p-tabla existe
  // c) Datos iniciales por defecto (SEED) asignados inmediatamente
  setProductos(SEED);
  // d) Renderizado inmediato de la tabla para que aparezca poblada desde el primer segundo
  renderProductos();
  // e) Asignar código automático sugerido al input #p-codigo (modo nuevo)
  asignarCodigoSugerido();
  // f) Actualizar modo visual después de pintar UI
  actualizarModo();
  // g) Posterior a pintar la UI inicial, si hasIPC ejecutamos listarProductos en segundo plano
  //    y al resolver, actualizamos PRODUCTOS, volvemos a renderizar y re-sugerimos código
  if(hasIPC){
    Promise.resolve(window.api.listarProductos()).then(function(rows){
      if(Array.isArray(rows) && rows.length){ setProductos(rows); renderProductos(); actualizarModo(); asignarCodigoSugerido(); }
    }).catch(function(){ console.error('Error cargando productos IPC en init'); actualizarModo(); });
  }
  tick(); setInterval(tick,1000);
  $('overlay').addEventListener('mousedown', function(e){ if(e.target===$('overlay')) cerrarDialogo(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(paletteEl) closePalette(); else if(dlgState) cerrarDialogo(); } });
  drawAllCharts();
  
  // Menú superior handlers
  var menubar = $('menubar');
  if(menubar){
    menubar.querySelectorAll('span').forEach(function(span, idx){
      span.addEventListener('click', function(e){
        var accion = span.textContent.trim();
        switch(accion){
          case 'Archivo': toast('Menú Archivo - Nueva ventana, Importar, Exportar'); break;
          case 'Editar': toast('Menú Editar - Modificar selección'); break;
          case 'Ver': toast('Menú Ver - Mostrar/ocultar campos'); break;
          case 'Procesos': toast('Menú Procesos - Actualizar estados, Ajustes'); break;
          case 'Inventario': toast('Módulo Inventario activo'); break;
          case 'Ayuda': toast('Mónica 9 - Sistema contable · Tasa: US$ 1 = C$ 19.960'); break;
        }
      });
    });
  }
  
status('Listo');
}
document.addEventListener('DOMContentLoaded', init);



</script>
